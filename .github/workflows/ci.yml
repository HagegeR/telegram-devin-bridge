name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: pipx run ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv venv --python ${{ matrix.python-version }} .venv
      - run: >-
          uv pip install -r requirements.txt -r requirements-dev.txt
          --python .venv/bin/python
      - run: .venv/bin/python -m pytest --timeout=300

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t telegram-devin-bridge .

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get install -y shellcheck
      # SC1007 misfires on the `CDPATH= cd` env-assignment idiom
      - run: >-
          shellcheck -e SC1007 -x deploy/self-update.sh
          deploy/alpine/install.sh deploy/vm/install.sh
          deploy/docker-entrypoint.sh

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: pipx run yamllint -d relaxed .github/workflows/

  deps-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: pipx run pip-audit -r requirements.txt
