name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to (re)publish — recovers a failed tag run
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag }} # empty on tag push: checks out the pushed tag
          fetch-depth: 0 # the main-ancestry gate needs full history
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          TAG=${INPUT_TAG:-$GITHUB_REF_NAME}
          # the push glob is coarse; release channels only accept strict
          # numeric vX.Y.Z tags, so gate on the same contract
          echo "$TAG" | grep -qE '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            || { echo "tag '$TAG' is not a strict vX.Y.Z semver"; exit 1; }
          # tag channels only see tags reachable from main
          # (self-update resolves with `git tag --merged origin/main`)
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD \
            || { echo "tag '$TAG' is not on main; tag channels would ignore this release"; exit 1; }
          # release body = the tag's CHANGELOG section + GitHub generated notes
          VER=${TAG#v}
          awk -v ver="$VER" '
            $0 ~ "^## \\[v?" ver "\\]" { found=1; next }
            /^## / { found=0 }
            found' CHANGELOG.md > section.md
          # a tag pushed ahead of its changelog commit can still release:
          # retry the extraction against FETCH_HEAD (origin/main)
          if [ ! -s section.md ]; then
            git show FETCH_HEAD:CHANGELOG.md |
              awk -v ver="$VER" '
                $0 ~ "^## \\[v?" ver "\\]" { found=1; next }
                /^## / { found=0 }
                found' > section.md || true
          fi
          [ -s section.md ] || { echo "no CHANGELOG.md section for $TAG (checked the tag and origin/main)"; exit 1; }
          gh api repos/{owner}/{repo}/releases/generate-notes \
            -f tag_name="$TAG" -q .body > generated.md
          cat section.md generated.md > body.md
          # a UI-drafted release already exists (drafting pushes the tag):
          # publish it with the generated notes instead of failing
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file body.md --verify-tag --draft=false
          else
            gh release create "$TAG" --notes-file body.md --verify-tag
          fi
