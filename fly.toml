app = "telegram-devin-bridge"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_PATH = "/data/bridge.sqlite3"

[mounts]
  source = "bridge_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"
